name: Missa TV 360 — rendu publicitaire 3D

on:
  push:
    branches:
      - missa-tv-360-3d-final3
    paths:
      - 'projects/missa-tv-360-3d/**'
      - '.github/workflows/missa-tv-360-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: missa-tv-360-3d-final3-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer FFmpeg et dépendances Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - name: Installer Three.js r160
        run: |
          npm install --prefix projects/missa-tv-360-3d --no-save three@0.160.0
          test -f projects/missa-tv-360-3d/node_modules/three/build/three.min.js
          cp projects/missa-tv-360-3d/node_modules/three/build/three.min.js projects/missa-tv-360-3d/vendor/three.min.js
          cp projects/missa-tv-360-3d/node_modules/three/LICENSE projects/missa-tv-360-3d/vendor/THREE-LICENSE.txt
      - name: Construire la timeline et mixer les SFX
        working-directory: projects/missa-tv-360-3d
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 librosa==0.10.2.post1 soundfile==0.12.1
          python tools/build.py
          python sfx/generate.py
          python tools/mix.py
          mkdir -p ../../sortie/audio ../../sortie/source
          cp missa-tv-360-pub.srt ../../sortie/missa-tv-360-pub-3d.srt
          cp rendu/piste-voix.wav ../../sortie/audio/piste-voix.wav
          cp rendu/piste-bruitages.wav ../../sortie/audio/piste-bruitages.wav
          cp rendu/audio-mix.wav ../../sortie/audio/audio-mix.wav
      - name: Vérifier la composition
        working-directory: projects/missa-tv-360-3d
        run: |
          npx --yes hyperframes@0.8.142 browser ensure
          npx --yes hyperframes@0.8.142 check
      - name: Rendre la vidéo verticale
        working-directory: projects/missa-tv-360-3d
        run: npx --yes hyperframes@0.8.142 render --fps 30 --quality delivery --output ../../sortie/video-sans-audio.mp4
      - name: Assembler et contrôler les livrables
        run: |
          ffmpeg -y -i sortie/video-sans-audio.mp4 -i sortie/audio/audio-mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 256k -ar 48000 -t 33.404 -movflags +faststart sortie/missa-tv-360-pub-3d-9x16.mp4
          ffmpeg -y -i sortie/missa-tv-360-pub-3d-9x16.mp4 -vf "scale=720:1280:flags=lanczos" -c:v libx264 -preset medium -crf 23 -c:a aac -b:a 128k -ar 48000 -movflags +faststart sortie/missa-tv-360-pub-3d-9x16-720p.mp4
          ffmpeg -y -ss 5 -i sortie/missa-tv-360-pub-3d-9x16.mp4 -frames:v 1 -vf "scale=540:960:flags=lanczos" sortie/couverture.jpg
          ffmpeg -y -i sortie/missa-tv-360-pub-3d-9x16.mp4 -vf "fps=1/4,scale=270:480:force_original_aspect_ratio=decrease,pad=270:480:(ow-iw)/2:(oh-ih)/2,tile=3x3:padding=12:margin=12" -frames:v 1 sortie/planche-contact.jpg
          rm -f sortie/video-sans-audio.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,sample_rate,channels -of json sortie/missa-tv-360-pub-3d-9x16.mp4 > sortie/rapport-ffprobe.json
          python - <<'PY'
          import json, subprocess
          p = "sortie/missa-tv-360-pub-3d-9x16.mp4"
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,width,height,r_frame_rate","-of","json",p]))
          video=next(s for s in data["streams"] if s["codec_type"]=="video")
          duration=float(data["format"]["duration"])
          assert (int(video["width"]),int(video["height"]))==(1080,1920),video
          assert abs(duration-33.404)<0.25,duration
          assert video["r_frame_rate"]=="30/1",video
          print(f"OK — {video['width']}x{video['height']} @ {video['r_frame_rate']}, {duration:.3f} s")
          PY
          cat > sortie/README.md <<'EOF'
          # MISSA TV 360 — film publicitaire 3D
          Master 9:16 1080×1920 @30 i/s, H.264/AAC, synchronisé sur la voix originale de 33,404 s.
          Variante légère 720×1280, sous-titres SRT et pistes audio WAV 48 kHz dans audio/.
          Voir couverture.jpg, planche-contact.jpg et rapport-ffprobe.json pour le contrôle de sortie.
          Sources éditables dans projects/missa-tv-360-3d/.
          EOF
      - name: Publier les livrables dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sortie/ projects/missa-tv-360-3d/vendor/three.min.js projects/missa-tv-360-3d/vendor/THREE-LICENSE.txt projects/missa-tv-360-3d/index.html projects/missa-tv-360-3d/missa-tv-360-pub.srt
          git commit -m "Rendu final de la publicité Missa TV 360 en 3D" || echo "Aucun changement à publier"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Copie de secours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missa-tv-360-3d-livrables
          path: sortie/
          if-no-files-found: warn
          retention-days: 30
