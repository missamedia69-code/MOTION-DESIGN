<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: linear-gradient(180deg, #0b1020 0%, #233c78 100%);
      }
      #root { width: 100%; height: 100%; position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #badge {
        position: absolute; top: 560px; left: 50%; margin-left: -90px;
        width: 180px; height: 180px; border-radius: 50%;
        background: #ff8c3c; box-shadow: inset 0 0 0 26px #ffc878;
      }
      #title {
        position: absolute; top: 850px; width: 100%; text-align: center;
        color: #ffffff; font-size: 118px; font-weight: 700; letter-spacing: 0.04em;
      }
      #subtitle {
        position: absolute; top: 1160px; width: 100%; text-align: center;
        color: #ffd08a; font-size: 46px; font-weight: 500;
      }
      #bar {
        position: absolute; top: 1330px; left: 50%; margin-left: -350px;
        width: 700px; height: 10px; border-radius: 5px; background: #ff8c3c;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div id="badge" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="4" data-track-index="1">HYPERFRAMES</h1>
      <p id="subtitle" class="clip" data-start="0" data-duration="4" data-track-index="2">HTML → vidéo, dans le moteur</p>
      <div id="bar" class="clip" data-start="0" data-duration="4" data-track-index="3"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#badge", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.2);
      tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.5);
      tl.fromTo("#subtitle", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.1);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 1.2);
      tl.to("#title", { opacity: 0, y: -40, duration: 0.5 }, 3.3);
      tl.to("#subtitle", { opacity: 0, duration: 0.5 }, 3.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
